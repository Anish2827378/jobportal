{% load static %}

{% block body %}

{% include 'user_navigation.html' %}

<marquee style="font-family:'monotype-corsiva'; font-size:25px; color:darkblue; background-color:black; font-weight:bold; margin-top:1%">
    Profile
</marquee>
<hr>

<div class="container">
    <div class="row">
        <div class="col-sm-6">

       
<form class=" mt-5"  name="Signup" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>First Name</label>
                <input type="text" class="form-control" name="fname" value="{{student.user.first_name}}" required>
        </div>

        <div class="form-group col-md-6">
            <label>Last Name</label>
                <input type="text" class="form-control" name="lname" value="{{student.user.last_name}}" required>
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group col-md-12">
            <label>Contact</label>
                <input type="text" class="form-control" name="contact" value="{{student.mobile}}" required>
        </div>

        

    </div>
    
    <div class="form-row">
        <div class="form-group col-md-12">
            <label>Email ID</label>
                <input type="text" class="form-control" name="email" value="{{student.user.username}}" readonly required>
        </div>
    </div>
    
    

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>Gender</label>
            {% if student.gender|lower == "male" %}

<div style="border:1px solid lightgray; padding:6px; border-radius:6px">

    <div class="custom-control custom-radio custom-control-inline">
        <input type="radio" id="customRadioInlinel" name="gender"
               class="custom-control-input" value="male" checked>
        <label class="custom-control-label" for="customRadioInlinel">
            Male
        </label>
    </div>

    <div class="custom-control custom-radio custom-control-inline">
        <input type="radio" id="customRadioInline2" name="gender"
               class="custom-control-input" value="female">
        <label class="custom-control-label" for="customRadioInline2">
            Female
        </label>
    </div>

</div>

{% else %}

<div style="border:1px solid lightgray; padding:6px; border-radius:6px">

    <div class="custom-control custom-radio custom-control-inline">
        <input type="radio" id="customRadioInlinel" name="gender"
               class="custom-control-input" value="male">
        <label class="custom-control-label" for="customRadioInlinel">
            Male
        </label>
    </div>

    <div class="custom-control custom-radio custom-control-inline">
        <input type="radio" id="customRadioInline2" name="gender"
               class="custom-control-input" value="female" checked>
        <label class="custom-control-label" for="customRadioInline2">
            Female
        </label>
    </div>

</div>

{% endif %}
           

        </div>

        <div class="form-group col-md-6">
            <label>Image</label>
            
            <input type="file" class="form-control" name="image" accept="image/*">
            
        </div>
    </div>

<input type="submit" value="Submit" class="btn btn-primary my-3 " style="width:300px">
    
    

</form>

 </div>
 <div class="col-sm-4 mt-5 text-center">
    <img src="{{student.image.url}}" width="3oopx" height="300px">

 </div>
    </div>
    </div>

{% include 'footer.html'%}

{% if error == "no" %}
<script>
    alert("profile Updated Successful");
    window.location.href = "{% url 'user_home' %}";
</script>
{% elif error == "yes" %}
<script>
    alert("Something went Wrong, Try Again..");
</script>
{% endif %}




{% endblock  %}
