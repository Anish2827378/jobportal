{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family:'monotype-corsiva'; font-size:25px; color:darkblue; background-color:black; font-weight:bold; margin-top:1%">
    User Login
</marquee>
<hr>

<form class="container mt-5" method="POST">
    {% csrf_token %}
    <label><b>Email ID</b></label>
    <input type="email" class="form-control" name="uname" placeholder="Enter Email ID">

    <label><b>Password</b></label>
    <input type="password" class="form-control" name="pwd" placeholder="Enter Password">

    <input type="submit"  value="Login" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black; height:40px; font-size:25px">
    <a href="{% url 'user_signup' %}" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black; height:40px; font-size:25px"> CREATE AN ACCOUNT</a>
</form> 

{% include 'footer.html'%}



{% if error == "no" %}
<script>
    alert("Login Successful");
    window.location.href = "{% url 'user_home' %}";
</script>
{% elif error == "yes" %}
<script>
    alert("Invalid Login Credentials, Try Again..");
</script>
{% endif %}

{% endblock  %}
