{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family:'monotype-corsiva'; font-size:25px; color:darkblue; background-color:black; font-weight:bold; margin-top:1%">
    Recruiter Login
</marquee>
<hr>

<form class="container mt-5" method="POST">
    {% csrf_token %}
    <label><b>Email ID</b></label>
    <input type="text" class="form-control" name="uname" placeholder="Enter Email ID">

    <label><b>Password</b></label>
    <input type="password" class="form-control" name="pwd" placeholder="Enter Password">

    <input type="submit" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black; height:40px; font-size:25px">

 <a href="{% url 'recruiter_signup' %}" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black; height:40px; font-size:25px"> CREATE AN ACCOUNT</a>
    
</form>  

{% if error == "no" %}
<script>
    alert("Login Successful");
    window.location.href = "{% url 'recruiter_home' %}";
</script>

{% elif error == "yes" %}
<script>
    alert("Invalid Login Credentials, Try Again..");
</script>

{% elif error == "not" %}
<script>
    alert("Your Login Status is Pending.");
</script>

{% endif %}



{% endblock  %}
