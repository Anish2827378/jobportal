{% load static %}

{% block body %}

{% include 'admin_navigation.html' %}

<marquee style="font-family:'monotype-corsiva'; font-size:25px; color:darkblue; background-color:black; font-weight:bold; margin-top:1%">
    View Recruiter - Pending.
</marquee>
<hr>

<form class="container mt-5" method="POST">
    {% csrf_token %}
    <label><b>Recruiter Name</b></label>
    <input type="text" class="form-control" name="uname" value="{{Recruiter.user.first_name}} {{Recruiter.user.last_name}}">

    <label><b>Status</b></label>
    <select class="form-control" name="status" >
        <option value="Accept">Accept</option>
        <option value="Reject">Reject</option>
    </select>

    <input type="submit" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black; height:40px; font-size:25px">


</form>  


{% if error == "no" %}
<script>
    alert("Status Changes Successful");
    window.location.href = "{% url 'recruiter_all' %}";
</script>
{% elif error == "yes" %}
<script>
    alert("Something Went Wrong , Try Again...");
</script>
{% endif %}


{% endblock  %}
